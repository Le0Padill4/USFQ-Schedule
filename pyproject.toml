[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usfq-schedule"
version = "0.0.0"
description = "Motor de USFQ-Schedule (Estructuras de Datos / Programacion Asistida)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# matplotlib solo se usa para graficos de benchmarks (dependencia de desarrollo).
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = ".pytest_cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
