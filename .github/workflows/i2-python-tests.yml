name: I2 Python tests

on:
  pull_request:
  push:
    branches:
      - 'feat/i2-avl-indices'

permissions:
  contents: read

jobs:
  i2-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run available I2 unit tests
        run: python -m unittest discover -s tests -p 'test_i2*.py' -v
      - name: Compile Python sources
        run: python -m compileall -q domain tests
